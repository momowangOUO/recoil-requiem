<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} a:hover rect{stroke:#b63d38;stroke-width:3}</style><rect width="100%" height="100%" fill="#f4efdf"/><text x="40" y="45" font-size="27" fill="#292a2d">LD-06 / 05 装卸场</text><text x="40" y="78" font-size="17" fill="#292a2d">世界范围 x=2400…4400；站立面 y=1840。掩体交错；伊娜在西侧安全龛</text><text x="40" y="110" font-size="16" fill="#292a2d">这是单空间施工剖面：实际物件位置见下方清单。红实线为无需开枪的通路，青虚线为反冲可选高点。</text><rect x="40" y="450" width="1120" height="68" fill="#a69b85" stroke="#afa895" /><text x="48" y="490" font-size="18" fill="#292a2d">有下一层：梁与后墙承托；最底层：连续实体地基。桥洞只在下层路线处保留。</text><rect x="40.0" y="270" width="179.20000000000002" height="180" fill="#e1e4d2" stroke="#8d9779" stroke-dasharray="6 5"/><rect x="1003.2" y="270" width="156.8" height="180" fill="#e1e4d2" stroke="#8d9779" stroke-dasharray="6 5"/><text x="48" y="255" font-size="15" fill="#292a2d">观察／交谈 320px</text><text x="980" y="255" font-size="15" fill="#292a2d">出口缓冲 280px</text><rect x="454.40000000000003" y="426" width="26.880000000000003" height="24" fill="#6c7673" stroke="#afa895" /><text x="436.40000000000003" y="545" font-size="13" fill="#292a2d">48×24石基座</text><rect x="695.2" y="426" width="26.880000000000003" height="24" fill="#6c7673" stroke="#afa895" /><text x="677.2" y="545" font-size="13" fill="#292a2d">48×24石基座</text><rect x="863.2" y="418" width="26.880000000000003" height="32" fill="#6c7673" stroke="#afa895" /><text x="845.2" y="545" font-size="13" fill="#292a2d">48×32石基座</text><path d="M219.20000000000002,442 L1003.2,442" fill="none" stroke="#b63d38" stroke-width="4" /><rect x="588.8000000000001" y="354" width="143.36" height="12" fill="#567a7a" stroke="#afa895" /><path d="M476.80000000000007,432 L588.8000000000001,342" fill="none" stroke="#207e83" stroke-width="3" stroke-dasharray="6 5"/><text x="588.8000000000001" y="330" font-size="14" fill="#292a2d">96px高 / 256px宽检修台</text><text x="40" y="570" font-size="16" fill="#292a2d">高点下面可通行；通往高点的反冲支路不计入主路验收。基座24px高，可正常跳越。</text><text x="40" y="610" font-size="18" fill="#292a2d">遭遇：盾卫×1＋女枪手×2</text><text x="40" y="644" font-size="17" fill="#292a2d">地标：吊车轨梁；放在人物平面后方。花纹、枝叶和书架不占用行走截面。</text><text x="40" y="682" font-size="17" fill="#292a2d">强制净空≥112px；主路台阶≤24px；换弹落脚面≥192px；新跨度仍须实控复测。</text></svg>