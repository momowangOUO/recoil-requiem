x前室。</text><text x="70" y="1035" font-size="18">F06与F07之间有未连通建筑：保持可选观察台，不能将其算作已连通上层主路。</text><text x="70" y="1065" font-size="18">S10补建于礼堂侧墙内；隧道尽端接既有返程货运门。没有宣称画出一条贯通全图的步行地下路。</text><text x="70" y="1095" font-size="18">主线：F01→S01→F02→S03→F03→S04→F04→任务门→F05。跳跃、开火、V均不是主路必要输入。</text></svg>