<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} a:hover rect{stroke:#b63d38;stroke-width:3}</style><rect width="100%" height="100%" fill="#f4efdf"/><text x="40" y="45" font-size="27" fill="#292a2d">LD-13 / 12 维护道</text><text x="40" y="78" font-size="17" fill="#292a2d">世界范围 x=8800…12000；站立面 y=1840。带休息台的竖向绕行；回到内庭</text><text x="40" y="110" font-size="16" fill="#292a2d">这是单空间施工剖面：实际物件位置见下方清单。红实线为无需开枪的通路，青虚线为反冲可选高点。</text><rect x="40" y="450" width="1120" height="68" fill="#a69b85" stroke="#afa895" /><text x="48" y="490" font-size="18" fill="#292a2d">有下一层：梁与后墙承托；最底层：连续实体地基。桥洞只在下层路线处保留。</text><rect x="40.0" y="270" width="112.0" height="180" fill="#e1e4d2" stroke="#8d9779" stroke-dasharray="6 5"/><rect x="1062.0" y="270" width="98.0" height="180" fill="#e1e4d2" stroke="#8d9779" stroke-dasharray="6 5"/><text x="48" y="255" font-size="15" fill="#292a2d">观察／交谈 320px</text><text x="980" y="255" font-size="15" fill="#292a2d">出口缓冲 280px</text><rect x="572.0" y="426" width="16.799999999999997" height="24" fill="#6c7673" stroke="#afa895" /><text x="554.0" y="545" font-size="13" fill="#292a2d">48×24石基座</text><path d="M152.0,442 L1062.0,442" fill="none" stroke="#b63d38" stroke-width="4" /><rect x="698.0" y="322" width="134.39999999999998" height="12" fill="#567a7a" stroke="#afa895" /><path d="M628.0,432 L698.0,310" fill="none" stroke="#207e83" stroke-width="3" stroke-dasharray="6 5"/><text x="698.0" y="298" font-size="14" fill="#292a2d">128px高 / 384px宽检修台</text><text x="40" y="570" font-size="16" fill="#292a2d">高点下面可通行；通往高点的反冲支路不计入主路验收。基座24px高，可正常跳越。</text><text x="40" y="610" font-size="18" fill="#292a2d">遭遇：空追×1＋突进×1＋女枪手×1</text><text x="40" y="644" font-size="17" fill="#292a2d">地标：弯管与检修框；放在人物平面后方。花纹、枝叶和书架不占用行走截面。</text><text x="40" y="682" font-size="17" fill="#292a2d">强制净空≥112px；主路台阶≤24px；换弹落脚面≥192px；新跨度仍须实控复测。</text></svg>