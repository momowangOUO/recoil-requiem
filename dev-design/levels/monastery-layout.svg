e" stroke="#207e83" stroke-width="5" /><path d="M731.0000000000001,278 L1046.0,278" fill="none" stroke="#207e83" stroke-width="5" /><path d="M1046.0,278 L1004.0000000000001,518" fill="none" stroke="#207e83" stroke-width="5" /><path d="M1046.0,278 L1340.0000000000002,278" fill="none" stroke="#207e83" stroke-width="5" /><path d="M1340.0000000000002,278 L1340.0000000000002,518" fill="none" stroke="#207e83" stroke-width="5" /><path d="M836.0000000000001,758 L1144.0,758" fill="none" stroke="#207e83" stroke-width="5" /><path d="M1144.0,758 L1536.0000000000002,758" fill="none" stroke="#207e83" stroke-width="5" /><path d="M1536.0000000000002,758 L1340.0000000000002,518" fill="none" stroke="#207e83" stroke-width="5" /><path d="M1620.0000000000002,518 V970 H192.0 V518" fill="none" stroke="#86622d" stroke-width="3" stroke-dasharray="8 6"/><a href="#space-01"><rect x="80.0" y="450" width="216.00000000000003" height="132" fill="#fffaf0" stroke="#afa895" /><text x="90.0" y="478" font-size="20" fill="#292a2d">01  运输站</text><text x="90.0" y="502" font-size="13" fill="#292a2d">x 0–1600 / 站立面 1120</text><text x="90.0" y="527" font-size="14" fill="#292a2d">安全观察；看见外庭塔楼</text><text x="90.0" y="571" font-size="14" fill="#785b35">候车棚</text></a><a href="#space-02"><rect x="304.0" y="450" width="216.00000000000003" height="132" fill="#fffaf0" stroke="#afa895" /><text x="314.0" y="478" font-size="20" fill="#292a2d">02  装卸入口</text><text x="314.0" y="502" font-size="13" fill="#292a2d">x 1600–3200 / 站立面 1120</text><text x="314.0" y="527" font-size="14" fill="#292a2d">正面路与地下货道分流</text><text x="314.0" y="571" font-size="14" fill="#785b35">封闭货运门</text></a><a href="#space-03"><rect x="528.0" y="450" width="272.0" height="132" fill="#fffaf0" stroke="#afa895" /><text x="538.0" y="478" font-size="20" fill="#292a2d">03  外庭</text><text x="538.0" y="502" font-size="13" fill="#292a2d">x 3200–5200 / 站立面 1120</text><text x="538.0" y="527" font-size="14" fill="#292a2d">先交谈，再选择高廊或装卸场</text><text x="538.0" y="571" font-size="14" fill="#785b35">石塔基座</text></a><a href="#space-04"><rect x="304.0" y="210" width="258.0" height="132" fill="#fffaf0" stroke="#afa895" /><text x="314.0" y="238" font-size="20" fill="#292a2d">04  西侧廊</text><text x="314.0" y="262" font-size="13" fill="#292a2d">x 1600–3500 / 站立面 400</text><text x="314.0" y="287" font-size="14" fill="#292a2d">绕行观察；近路返回外庭</text><text x="314.0" y="331" font-size="14" fill="#785b35">拱窗长廊</text></a><a href="#space-05"><rect x="416.00000000000006" y="690" width="272.0" height="132" fill="#fffaf0" stroke="#afa895" /><text x="426.00000000000006" y="718" font-size="20" fill="#292a2d">05  装卸场</text><text x="426.00000000000006" y="742" font-size="13" fill="#292a2d">x 2400–4400 / 站立面 1840</text><text x="426.00000000000006" y="767" font-size="14" fill="#292a2d">掩体交错；伊娜在西侧安全龛</text><text x="426.00000000000006" y="811" font-size="14" fill="#785b35">吊车轨梁</text></a><a href="#space-06"><rect x="570.0" y="210" width="314.00000000000006" height="132" fill="#fffaf0" stroke="#afa895" /><text x="580.0" y="238" font-size="20" fill="#292a2d">06  上层走廊</text><text x="580.0" y="262" font-size="13" fill="#292a2d">x 3500–5800 / 站立面 400</text><text x="580.0" y="287" font-size="14" fill="#292a2d">先看见投弹预警，再穿过高低火</text><text x="580.0" y="307" font-size="14" fill="#292a2d">线</text><text x="580.0" y="331" font-size="14" fill="#785b35">断桥与下层接应路</text></a><a href="#space-07"><rect x="696.0000000000001" y="690" width="272.0" height="132" fill="#fffaf0" stroke="#afa895" /><text x="706.0000000000001" y="718" font-size="20" fill="#292a2d">07  货梯间</text><text x="706.0000000000001" y="742" font-size="13" fill="#292a2d">x 4400–6400 / 站立面 1840</text><text x="706.0000000000001" y="767" font-size="14" fill="#292a2d">维拉与工具现场；借货梯重返中</text><text x="706.0000000000001" y="787" font-size="14" fill="#292a2d">层</text><text x="706.0000000000001" y="811" font-size="14" fill="#785b35">双轨货梯框</text></a><a href="#space-08"><rect x="808.0000000000001" y="450" width="384.00000000000006" height="132" fill="#fffaf0" stroke="#afa895" /><text x="818.0000000000001" y="478" font-size="20" fill="#292a2d">08  中央庭院</text><text x="818.0000000000001" y="502" font-size="13" fill="#292a2d">x 5200–8000 / 站立面 1120</text><text x="818.0000000000001" y="527" font-size="14" fill="#292a2d">两翼重汇；赛琳交谈与协战</text><text x="818.0000000000001" y="571" font-size="14" fill="#785b35">独立钟架</text></a><a href="#space-09"><rect x="892.0000000000001" y="210" width="300.00000000000006" height="132" fill="#fffaf0" stroke="#afa895" /><text x="902.0000000000001" y="238" font-size="20" fill="#292a2d">09  钟台</text><text x="902.0000000000001" y="262" font-size="13" fill="#292a2d">x 5800–8000 / 站立面 400</text><text x="902.0000000000001" y="287" font-size="14" fill="#292a2d">先观察下方落点，再绕到火力后</text><text x="902.0000000000001" y="307" font-size="14" fill="#292a2d">侧</text><text x="902.0000000000001" y="331" font-size="14" fill="#785b35">钟台支架</text></a><a href="#space-10"><rect x="80.0" y="690" width="328.00000000000006" height="132" fill="#fffaf0" stroke="#afa895" /><text x="90.0" y="718" font-size="20" fill="#292a2d">10  地下货道</text><text x="90.0" y="742" font-size="13" fill="#292a2d">x 0–2400 / 站立面 1840</text><text x="90.0" y="767" font-size="14" fill="#292a2d">低路有连续地基；回收失足玩家</text><text x="90.0" y="811" font-size="14" fill="#785b35">砖拱与货轨</text></a><a href="#space-11"><rect x="976.0000000000001" y="690" width="328.00000000000006" height="132" fill="#fffaf0" stroke="#afa895" /><text x="986.0000000000001" y="718" font-size="20" fill="#292a2d">11  泵房</text><text x="986.0000000000001" y="742" font-size="13" fill="#292a2d">x 6400–8800 / 站立面 1840</text><text x="986.0000000000001" y="767" font-size="14" fill="#292a2d">支路交付；设备分割射线</text><text x="986.0000000000001" y="811" font-size="14" fill="#785b35">双泵罐</text></a><a href="#space-12"><rect x="1312.0000000000002" y="690" width="440.00000000000006" height="132" fill="#fffaf0" stroke="#afa895" /><text x="1322.0000000000002" y="718" font-size="20" fill="#292a2d">12  维护道</text><text x="1322.0000000000002" y="742" font-size="13" fill="#292a2d">x 8800–12000 / 站立面 1840</text><text x="1322.0000000000002" y="767" font-size="14" fill="#292a2d">带休息台的竖向绕行；回到内庭</text><text x="1322.0000000000002" y="811" font-size="14" fill="#785b35">弯管与检修框</text></a><a href="#space-13"><rect x="1200.0" y="210" width="272.0" height="132" fill="#fffaf0" stroke="#afa895" /><text x="1210.0" y="238" font-size="20" fill="#292a2d">13  档案走廊</text><text x="1210.0" y="262" font-size="13" fill="#292a2d">x 8000–10000 / 站立面 400</text><text x="1210.0" y="287" font-size="14" fill="#292a2d">记录在可撤回侧室；短战后调查</text><text x="1210.0" y="331" font-size="14" fill="#785b35">嵌墙档案柜</text></a><a href="#space-14"><rect x="1200.0" y="450" width="272.0" height="132" fill="#fffaf0" stroke="#afa895" /><text x="1210.0" y="478" font-size="20" fill="#292a2d">14  内庭</text><text x="1210.0" y="502" font-size="13" fill="#292a2d">x 8000–10000 / 站立面 1120</text><text x="1210.0" y="527" font-size="14" fill="#292a2d">收束路线；行李与出发点分开</text><text x="1210.0" y="571" font-size="14" fill="#785b35">装车雨棚</text></a><a href="#space-15"><rect x="1480.0000000000002" y="210" width="272.0" height="132" fill="#fffaf0" stroke="#afa895" /><text x="1490.0000000000002" y="238" font-size="20" fill="#292a2d">15  装车礼堂</text><text x="1490.0000000000002" y="262" font-size="13" fill="#292a2d">x 10000–12000 / 站立面 400</text><text x="1490.0000000000002" y="287" font-size="14" fill="#292a2d">入口观察；两段掩护后接近维拉</text><text x="1490.0000000000002" y="331" font-size="14" fill="#785b35">高拱与货轨终点</text></a><a href="#space-16"><rect x="1480.0000000000002" y="450" width="272.0" height="132" fill="#fffaf0" stroke="#afa895" /><text x="1490.0000000000002" y="478" font-size="20" fill="#292a2d">16  后门</text><text x="1490.0000000000002" y="502" font-size="13" fill="#292a2d">x 10000–12000 / 站立面 1120</text><text x="1490.0000000000002" y="527" font-size="14" fill="#292a2d">赛琳封锁；战后走货运捷径回访</text><text x="1490.0000000000002" y="571" font-size="14" fill="#785b35">石门楼</text></a><text x="52" y="1018" font-size="20" fill="#292a2d">主要顺序：运输站 → 外庭 → 装卸場／货梯 → 中央庭院 → 内庭 → 赛琳 → 维拉 → 后门回访</text><text x="52" y="1052" font-size="17" fill="#292a2d">四条既有货运捷径保留：02↔10、04↔08、09↔14、16↔01；开放条件沿用任务事实，不能充当新的剧情锁。</text><text x="52" y="1085" font-size="17" fill="#292a2d">空间间连线表示设计通路。施工须补齐实际楼梯、门洞与支承；不能把图上的连通当成玩家已经走得通。</text></svg>