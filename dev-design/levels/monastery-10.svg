<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} a:hover rect{stroke:#b63d38;stroke-width:3}</style><rect width="100%" height="100%" fill="#f4efdf"/><text x="40" y="45" font-size="27" fill="#292a2d">LD-11 / 10 地下货道</text><text x="40" y="78" font-size="17" fill="#292a2d">世界范围 x=0…2400；站立面 y=1840。低路有连续地基；回收失足玩家</text><text x="40" y="110" font-size="16" fill="#292a2d">这是单空间施工剖面：实际物件位置见下方清单。红实线为无需开枪的通路，青虚线为反冲可选高点。</text><rect x="40" y="450" width="1120" height="68" fill="#a69b85" stroke="#afa895" /><text x="48" y="490" font-size="18" fill="#292a2d">有下一层：梁与后墙承托；最底层：连续实体地基。桥洞只在下层路线处保留。</text><rect x="40.0" y="270" width="149.33333333333334" height="180" fill="#e1e4d2" stroke="#8d9779" stroke-dasharray="6 5"/><rect x="1029.3333333333335" y="270" width="130.66666666666666" height="180" fill="#e1e4d2" stroke="#8d9779" stroke-dasharray="6 5"/><text x="48" y="255" font-size="15" fill="#292a2d">观察／交谈 320px</text><text x="980" y="255" font-size="15" fill="#292a2d">出口缓冲 280px</text><rect x="590.6666666666666" y="426" width="22.4" height="24" fill="#6c7673" stroke="#afa895" /><text x="572.6666666666666" y="545" font-size="13" fill="#292a2d">48×24石基座</text><rect x="758.6666666666666" y="426" width="22.4" height="24" fill="#6c7673" stroke="#afa895" /><text x="740.6666666666666" y="545" font-size="13" fill="#292a2d">48×24石基座</text><path d="M189.33333333333334,442 L1029.3333333333335,442" fill="none" stroke="#b63d38" stroke-width="4" /><text x="40" y="570" font-size="16" fill="#292a2d">高点下面可通行；通往高点的反冲支路不计入主路验收。基座24px高，可正常跳越。</text><text x="40" y="610" font-size="18" fill="#292a2d">遭遇：盾卫×1＋突进×1＋女枪手×1</text><text x="40" y="644" font-size="17" fill="#292a2d">地标：砖拱与货轨；放在人物平面后方。花纹、枝叶和书架不占用行走截面。</text><text x="40" y="682" font-size="17" fill="#292a2d">强制净空≥112px；主路台阶≤24px；换弹落脚面≥192px；新跨度仍须实控复测。</text></svg>